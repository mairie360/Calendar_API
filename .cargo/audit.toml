# Every ignored advisory carries why it does not apply to this API (MAIR-427). Re-check each one
# when its dependency path changes (`cargo tree -i <crate>`), and drop it once a fixed version lands.
[advisories]
ignore = [
    # rsa 0.9 (Marvin attack, timing side channel on RSA *decryption and signing* with a private
    # key; no fixed release). Pulled by jsonwebtoken through mairie360_api_lib, which only
    # *verifies* RS256 Keycloak signatures with public keys: no private-key operation runs here.
    "RUSTSEC-2023-0071",
    # h2 0.3 (unbounded empty DATA frames, an HTTP/2 denial of service). Pulled by actix-http,
    # whose HTTP/2 server is only used behind TLS (`bind_rustls` / `bind_openssl`): the API binds
    # plain HTTP/1.1 (`HttpServer::bind`), so h2 never parses a frame.
    "RUSTSEC-2026-0258",
    # zip 8 (build-dependency of utoipa-swagger-ui 10, which requires zip ^8.6), unconfined
    # permissions, symlinks and SUID bits on extraction (fixed in zip >= 9.0.0). zip only runs in
    # utoipa-swagger-ui's build script, extracting the Swagger UI archive it ships, never an
    # archive from a user, and is not in the binary. Drop these once utoipa-swagger-ui moves to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # crypto-bigint 0.5 (timing variability of operations meant to be constant-time; fixed in
    # 0.7.6, which elliptic-curve 0.13 cannot use). Pulled by jsonwebtoken (p256/p384) through
    # mairie360_api_lib, which only *verifies* ES256/ES384 Keycloak signatures with public keys:
    # no secret goes through these operations. Drop it once jsonwebtoken moves to elliptic-curve 0.14.
    "RUSTSEC-2026-0387",
]
