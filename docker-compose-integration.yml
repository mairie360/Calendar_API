# Integration test stack (MAIR-117): the same services as docker-compose.yml plus a `newman`
# runner that replays the committed Postman collection against the API over the compose network.
# Run it with ./integration_test.sh (this is what the CICD `integration_tests` job executes).
volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3002
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  # Calendar connects with its own role, like in staging/prod (MAIR-556): a query its grants do
  # not cover fails here. The superuser stays for postgres, liquibase and the seeder.
  DB_USER: calendar_api
  DB_HOST: postgres
  DB_PASSWORD: calendar-api-password
  DB_PORT: 5432

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-90c22bb
    restart: always
    container_name: mairie360-db-calendar-api-integration
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-90c22bb
    container_name: mairie360-liquibase-calendar-api-integration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 refuses to seed the admin (users.id = 1) without credentials: this
    # throwaway stack uses the public template admin. Never pass the flag on a real instance.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
      -Dcalendar_api_password=calendar-api-password
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: mairie360-redis-calendar-api-integration
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Seeds the extra test user (id 2) the collection uses as a plain user.
  seeder:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: mairie360-seeder-calendar-api-integration
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  calendar:
    container_name: calendar-api-integration
    # The API under test: the published ghcr.io/mairie360/calendar-api:dev-<sha> image in CI, or
    # calendar-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    restart: always
    expose:
      - "3002"
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://calendar.development.mairie360.fr
      # MAIR-680: Core's public key only, no JWT_SECRET, so every HS256 token is refused. Fresh key
      # pair per run from the matching *_test.sh script (test_secrets.sh), which also signs the
      # runners' tokens with it: no key or token is committed.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
      # Swagger UI and /api-docs/openapi.json are off unless enabled (MAIR-424); this stack reads the spec.
      SWAGGER_ENABLED: "true"
    depends_on:
      seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /ready (PostgreSQL and Redis reachable, MAIR-423) and the
  # services that need the API wait for it to
  # complete instead.
  calendar-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    depends_on:
      calendar:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://calendar:3002/ready >/dev/null; do
      echo "waiting for calendar..."; sleep 2; done; echo "calendar ready"'
    networks:
      - backend

  # Replays tests/postman/collection.json against the `calendar` service. `baseUrl` is injected
  # here so the committed environment stays usable from a host shell (http://localhost:3002).
  # `--bail` stops at the first failing request; the exit code is what integration_test.sh returns.
  newman:
    image: postman/newman:6.1.3-alpine@sha256:d9b5e780ead0026bbb37f3759cd7b10fc8a88cd4030c8266a7c5e343d75a5198
    container_name: mairie360-newman-calendar-api
    networks:
      - backend
    volumes:
      - ./tests/postman:/etc/newman:ro
    depends_on:
      calendar-ready:
        condition: service_completed_successfully
    command: >
      run /etc/newman/collection.json
      --environment /etc/newman/environment.json
      --env-var baseUrl=http://calendar:3002
      --env-var jwt_admin=${JWT_ADMIN:?JWT_ADMIN must be set, run ./integration_test.sh}
      --env-var jwt_agent=${JWT_AGENT:?JWT_AGENT must be set, run ./integration_test.sh}
      --env-var jwt_forged=${JWT_FORGED:?JWT_FORGED must be set, run ./integration_test.sh}
      --env-var jwt_expired=${JWT_EXPIRED:?JWT_EXPIRED must be set, run ./integration_test.sh}
      --env-var jwt_responsable=${JWT_RESPONSABLE:?JWT_RESPONSABLE must be set, run ./integration_test.sh}
      --bail
